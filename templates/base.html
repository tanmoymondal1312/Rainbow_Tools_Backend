{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Rainbow Tools{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'img/rainbowtoolicon.png' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <a href="{% url 'home' %}" class="brand">
            <img src="{% static 'img/rainbowtoolicon.png' %}" alt="Rainbow Tools" class="brand-logo">
            <span class="brand-name">Rainbow Tools</span>
        </a>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>&copy; {% now "Y" %} Rainbow Tools. All rights reserved.</p>
    </footer>
    {% block extra_js %}{% endblock %}
</body>
</html>
