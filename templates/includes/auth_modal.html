{% load static %}
<div class="auth-modal-overlay" id="auth-modal">
    <div class="auth-modal">
        <button class="auth-modal-close" id="auth-close" aria-label="Close">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>

        <div class="auth-modal-header">
            <h2 id="auth-title">Sign in to Rainbow Tools</h2>
            <p id="auth-subtitle">Access your account and saved preferences.</p>
        </div>

        <div class="auth-modal-body">
            <button class="auth-google-btn" id="auth-google-btn">
                <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                Continue with Google
            </button>

            <div class="auth-divider">
                <span>or</span>
            </div>

            <form id="auth-email-form" class="auth-form">
                <div class="auth-field">
                    <label for="auth-email">Email</label>
                    <input type="email" id="auth-email" placeholder="you@example.com" required>
                </div>
                <div class="auth-field">
                    <label for="auth-password">Password</label>
                    <input type="password" id="auth-password" placeholder="••••••••" required minlength="6">
                </div>
                <div class="auth-error" id="auth-error"></div>
                <button type="submit" class="btn btn-primary btn-block auth-submit" id="auth-submit-btn">
                    Sign In
                </button>
            </form>

            <p class="auth-switch">
                <span id="auth-switch-text">Don't have an account?</span>
                <button class="auth-switch-btn" id="auth-switch-btn">Sign Up</button>
            </p>
        </div>
    </div>
</div>
